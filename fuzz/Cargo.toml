[package]
name = "hikari-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# `cargo check` on this manifest needs *something* to look at, and an empty
# lib is what cargo-fuzz's own template ships, for that reason.
[lib]
path = "src/lib.rs"

# The targets themselves must be declared as bins. `cargo fuzz run css` resolves
# `css` as a *bin target of this package* and does not scan `fuzz_targets/` on
# its own, so without these entries the job dies with
#
#     error: no bin target named `css` in default-run packages
#
# which is what both fuzz jobs did on every run they had ever executed.
#
# `test`/`doc` are off because these binaries link libFuzzer's `main`, which is
# not something a test or doc harness should pull in.
[[bin]]
name = "css"
path = "fuzz_targets/css.rs"
test = false
doc = false

[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false

[[bin]]
name = "tree_json"
path = "fuzz_targets/tree_json.rs"
test = false
doc = false

[[bin]]
name = "fonts"
path = "fuzz_targets/fonts.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.hikari-rs-core]
path = "../crates/hikari-core"

[dependencies.hikari-rs-pdf]
path = "../crates/hikari-pdf"

# `hikari-rs` was deliberately absent for a long time: the `css` and `pdf`
# targets drive the parsers directly, and fuzzing the facade would spend most
# of its budget in argument marshalling. The `tree_json` and `fonts` targets
# break that rule on purpose and say so in their headers: they exist precisely
# to exercise what the WASM and Node bindings accept from a JS caller, so
# going through the facade's `render_svg` / `register_font` *is* the surface
# under test, not overhead. `serde_json` is there because the binding's first
# act on a render call is that parse.
[dependencies.hikari-rs]
path = "../crates/hikari"

[dependencies.serde_json]
version = "1"

# Fuzz targets are excluded from the workspace so a `cargo test --workspace` on
# the library does not try to build libfuzzer-sys, and so `cargo deny` does not
# have to know about it.
[workspace]
members = ["."]
