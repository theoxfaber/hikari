[package]
name = "hikari-rs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Layout, shaping, and content-hash caching for the Hikari render engine."
keywords = ["rendering", "layout", "text"]
categories = ["multimedia"]
repository = "https://github.com/theoxfaber/hikari"
homepage = "https://theoxfaber.github.io/hikari"

[lib]
name = "hikari_core"

[features]
default = ["bundled-hebrew"]
# Bundle a subsetted OFL Hebrew face, so Hebrew joins instead of drawing as
# isolated letters. 57 KB after subsetting.
bundled-hebrew = []
# Bundle a subsetted OFL CJK face. Opt-in because it is 9.9 MB after
# subsetting, which would dwarf the 2.8 MB WebAssembly build. Enable it for
# native deployments that must render CJK deterministically.
bundled-cjk = []

[dependencies]
taffy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
rustybuzz.workspace = true
unicode-bidi.workspace = true
ttf-parser = { version = "0.21" }
image.workspace = true

[build-dependencies]
# The embedded font is subset by build/subset.rs, which needs no dependencies.

[lints]
workspace = true
