# `description` and `repository` were missing; crates.io showed a bare page for
# this member and the manifest-level warning carried into every publish.
[package]
name = "hikari-rs-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node.js bindings for the Hikari render engine (napi)."
repository = "https://github.com/theoxfaber/hikari"

[lib]
name = "hikari_node"
crate-type = ["cdylib", "rlib"]

[dependencies]
hikari-rs.workspace = true
napi.workspace = true
napi-derive.workspace = true
serde_json.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true

[lints]
workspace = true
