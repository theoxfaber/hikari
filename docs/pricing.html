<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Permanent: /pricing.html became /licence.html in v0.20 when the Pro tier
     was removed and everything became free. Anyone with the old URL bookmarked
     or in a blog post should land somewhere useful rather than a 404. -->
<meta http-equiv="refresh" content="0; url=licence.html">
<link rel="canonical" href="licence.html">
<title>Hikari — Pricing is now Licence</title>
<link rel="stylesheet" href="style.css">
<style>
  /* A redirect page that renders instantly still gets read on a slow
     connection, so it carries the explanation too. */
  body { display: grid; place-items: center; min-height: 100vh; padding: var(--s-6); }
  .box { max-width: 44ch; text-align: center; }
  .box p { color: var(--text-dim); margin-top: var(--s-3); }
</style>
</head>
<body>
  <div class="box">
    <h1>Pricing is now Licence</h1>
    <p>
      There is no paid tier any more — every backend is free under
      MIT/Apache-2.0. Redirecting to the licence page.
    </p>
    <p><a href="licence.html">Continue</a></p>
  </div>
</body>
</html>
