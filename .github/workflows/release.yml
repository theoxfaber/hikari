name: release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build native binding
        # Plain cargo over the workspace, not the napi CLI: the napi CLI wants
        # a root `package.json` (v3) or a root `[package]` (v2), and neither
        # exists in this repo, so the release alone was never reproducible
        # locally. `hikari-rs-node` is a cdylib; the `.node` file a loader opens
        # is that cdylib under another name -- the same copying the README's
        # manual build documents.
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p hikari-rs-node --target ${{ matrix.target }}
          out="target/${{ matrix.target }}/release"
          art=""
          for cand in libhikari_node.dylib libhikari_node.so hikari_node.dll; do
            if [ -f "$out/$cand" ]; then art="$cand"; break; fi
          done
          if [ -z "$art" ]; then
            echo "::error::no cdylib produced in $out"; ls -la "$out" | head -20; exit 1
          fi
          # Every leg would otherwise produce the same `hikari-node.node`, and
          # the merged download below collapses them: seven uploads, one
          # survivor, so the published package would ship a single platform's
          # binary to everyone. Suffix per target; npm/index.js resolves the
          # file from process.platform/arch at require time.
          cp "$out/$art" npm/hikari-node.${{ matrix.target }}.node
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: npm/hikari-node.${{ matrix.target }}.node
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: npm
          merge-multiple: true
      - run: npm publish ./npm --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish crates to crates.io
        # The tag release published npm only, so crates.io version drift
        # appeared the moment a release shipped: `cargo add hikari-rs` served
        # whatever was last pushed by hand. This publishes every workspace
        # member in dependency order, from the workspace root with `-p` --
        # publishing by `cd`-ing into directories is a second, error-prone
        # way of saying the same thing.
        #
        # "Already exists" is the normal state of a rerun and of a version
        # bumped in npm first, so it is parsed and treated as success. Any
        # other failure stops the loop, because a silent partial publish is
        # worse than a visible one.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          ORDER=(
            hikari-rs-core
            hikari-rs-raster
            hikari-rs-svg
            hikari-rs-pdf
            hikari-rs-animate
            hikari-rs
            hikari-rs-wasm
            hikari-rs-node
          )
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set on this repository; the crates.io publish step is skipped. npm publishes still happen. To enable, add a crates.io token as the CARGO_REGISTRY_TOKEN secret."
            exit 0
          fi
          for crate in "${ORDER[@]}"; do
            echo "publishing $crate"
            log=$(cargo publish -p "$crate" 2>&1) || {
              if echo "$log" | grep -q "already exists on crates.io"; then
                echo "$crate: version already published, treating as done"
                continue
              fi
              echo "$log"
              echo "::error::crates.io publish failed for $crate; the remaining members were NOT published."
              exit 1
            }
            echo "$log" | grep -E "^Settings|^Upload|Published|Updating crates.io" | head -4
            # A dependency in the next iteration's Cargo.toml must be
            # resolvable from crates.io; the index can lag a second behind
            # the upload, so wait for the just-published version to appear.
            ver=$(cargo metadata --no-deps --format-version 1 \
                  | python3 -c 'import json,sys;print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="'"$crate"'"))')
            for _ in $(seq 1 30); do
              cargo search --limit 1 "$crate" 2>/dev/null | grep -q "^$crate = \"$ver\"" && break
              sleep 5
            done
          done
