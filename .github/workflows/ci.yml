name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep the build honest: the embedded font subset is produced by build.rs and
  # a broken subset is a *silent* shaping regression, so the build script runs
  # with warnings visible and the font tests below act as the real gate.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # CJK renders through a system fallback font, not the embedded subset.
      # Without one installed the fallback path is never exercised and its test
      # skips itself, so install a real CJK font and keep that code covered.
      - name: install CJK fallback font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list | grep -qi "noto.*cjk" || { echo "no CJK font installed"; exit 1; }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # hikari-rs-node is excluded: its test binary links the N-API symbols
      # (napi_get_reference_value and friends), which only exist inside a Node
      # process. Linking it on a bare Linux runner fails with undefined
      # symbols. That crate is covered by the `node bindings` job below, which
      # runs its real test through an actual Node runtime.
      - run: cargo test --workspace --exclude hikari-rs-node
      - run: cargo test -p hikari-rs-node --no-run
        continue-on-error: true

  node:
    name: node bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The custom-font checks need a font that is not the embedded one. A bare
      # runner has none, so they would silently skip -- install one so the
      # registry is genuinely exercised.
      - name: install a second font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          ls /usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf
      - name: build native binding
        run: |
          cargo build --release -p hikari-rs-node
          cp target/release/libhikari_node.so npm/hikari-node.node
      - name: test through a real node runtime
        run: node npm/test.mjs
      # Smoke-check the published package metadata: a missing `types` file or a
      # placeholder repository URL is invisible until someone installs it.
      - name: check package metadata
        run: |
          cd npm
          npm pkg get name version types files repository > /dev/null
          test -f index.d.ts || { echo "index.d.ts declared in types but missing"; exit 1; }
          grep -q "github.com/theoxfaber/hikari" package.json || {
            echo "repository URL is not the real one"; exit 1; }

  font:
    name: embedded font shaping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # These tests are the only thing standing between us and a silently
      # broken embedded font: a subsetter that renumbers glyphs and drops
      # GSUB/GPOS still renders Latin, still passes a smoke test, and still
      # produces a valid PNG -- while losing Arabic joining, kerning and
      # ligatures. They are split into their own job so a font regression is
      # impossible to miss in the noise of a full workspace run.
      - run: cargo test -p hikari-rs-core font_subset -- --nocapture
      - run: cargo test -p hikari-rs-raster shaped_glyph_ids -- --nocapture

  font-chain:
    name: bundled font chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The chain splits a run by font coverage and shapes each segment with a
      # face that has the glyph. That is the only way fallback text can join,
      # because joining happens in the shaper and a character-keyed rasterizer
      # lookup bypasses it entirely. It gets its own job because the failure it
      # guards is silent: a broken chain still emits valid PNGs, just blank or
      # unshaped where a script should be.
      - name: fetch the OFL CJK face
        run: sh scripts/fetch-bundled-fonts.sh cjk
      - name: fallback routes to a real face
        run: cargo test -p hikari-rs-core --features bundled-cjk font_chain -- --nocapture
      - name: fallback reaches the rasterizer
        run: cargo test -p hikari-rs --features bundled-cjk --test font_fallback_chain -- --nocapture
      # The opt-in feature must not break the default build, so compile the
      # whole workspace with it on as well as off.
      - run: cargo clippy --workspace --all-targets --features hikari-rs/bundled-cjk -- -D warnings

  determinism:
    name: cross-platform byte determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same input must produce the same bytes on every platform, which is what
      # makes the output snapshot-testable at all. Expected digests live in
      # crates/hikari/tests/determinism.sha256; the example exits non-zero on a
      # mismatch and prints the re-bless command.
      - run: cargo run --release -p hikari-rs --example determinism

  corpus:
    name: golden image corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One case per capability, so a visual regression names the feature that
      # moved instead of hiding in one opaque image. A mismatch prints the byte
      # delta, because "hash differs" does not tell a reviewer whether the
      # change was intended.
      - name: feature digests match
        run: cargo run --release -p hikari-rs --example corpus
      # A digest proves stability, not correctness: a blank render is just as
      # stable as a correct one and would be blessed happily. This asserts every
      # case actually has content, with measured floors. It is what caught the
      # radial gradient rendering as a flat fill.
      - name: every case draws something
        run: cargo run --release -p hikari-rs --example corpus_ink

  benches:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A smoke run, not a gate: criterion on shared CI runners is far too noisy
      # to assert on a single measurement. This catches benches that stop
      # compiling or hang.
      #
      # It does one thing a bare smoke run did not: it prints criterion's change
      # column so a regression is visible in the log even though it is not
      # enforced. `--save-baseline` writes criterion's own state under `target`,
      # so a run in CI has nothing to compare against on its first execution --
      # but from the second onwards the log shows `change: +x.x%` per benchmark,
      # which turns "someone should look at this" into "someone did".
      - name: run render benchmarks
        run: |
          cargo bench -p hikari-rs --bench render -- \
            --warm-up-time 1 --measurement-time 2 --sample-size 10 --save-baseline ci
      - name: summarise
        run: |
          {
            echo "### render benchmark"
            echo ""
            echo 'Criterion reports a change against the previous run in the job log.'
            echo "Shared runners are noisy, so this is a signal, not a gate."
          } >> "$GITHUB_STEP_SUMMARY"

  wasm-size:
    name: wasm size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # A budget, not a smoke test. The WASM bundle grew 2.95 MB -> 3.51 MB over
      # three dependency migrations and nothing noticed, because "it compiles" is
      # not a statement about size. The README quotes a figure that had quietly
      # stopped being true.
      #
      # Unoptimised on purpose: this is the raw `cargo build --release` output,
      # which is what the README quotes and what a reviewer can reproduce without
      # installing wasm-opt. Adding wasm-opt would make the number better and
      # less checkable, and the budget is about catching *unplanned* growth.
      - name: build wasm
        run: cargo build --release -p hikari-rs-wasm --target wasm32-unknown-unknown
      - name: check against budget
        run: |
          set -euo pipefail
          WASM=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -print -quit)
          test -n "$WASM" || { echo "no wasm produced"; exit 1; }
          BYTES=$(wc -c < "$WASM" | tr -d ' ')
          # 3.75 MB. The measured size is 3.51 MB, so this leaves roughly 250 KB of
          # headroom: enough for an intended change, little enough that a
          # dependency that quietly adds half a megabyte fails.
          BUDGET=$((3750 * 1024))
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / 1048576}")
          echo "wasm: $MB ($BYTES bytes), budget 3.75 MB"
          if [ "$BYTES" -gt "$BUDGET" ]; then
            echo "::error::wasm grew to $MB, over the 3.75 MB budget."
            echo "If this was intended, raise the budget in .github/workflows/ci.yml"
            echo "and update the figure quoted in README.md."
            exit 1
          fi

  audit:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
