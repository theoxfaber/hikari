name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep the build honest: the embedded font subset is produced by build.rs and
  # a broken subset is a *silent* shaping regression, so the build script runs
  # with warnings visible and the font tests below act as the real gate.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # No system CJK font is installed here, and that is now the point: as of
      # v0.21.9 the default fallback policy never reads a host font, so a runner
      # with fonts installed and one without must produce identical output. The
      # `determinism` job runs this matrix and asserts exactly that, and this job
      # deliberately does *not* install `fonts-noto-cjk` -- installing it would
      # hide the difference the matrix exists to catch.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # hikari-rs-node is excluded: its test binary links the N-API symbols
      # (napi_get_reference_value and friends), which only exist inside a Node
      # process. Linking it on a bare Linux runner fails with undefined
      # symbols. That crate is covered by the `node bindings` job below, which
      # runs its real test through an actual Node runtime.
      - run: cargo test --workspace --exclude hikari-rs-node
      - run: cargo test -p hikari-rs-node --no-run
        continue-on-error: true

  node:
    name: node bindings (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 18 is end-of-life but is what several downstream users still run, and an
        # API that only works on the newest Node is an API most people cannot use.
        # 24 is included because it is current at the time of writing and the
        # oldest release most users will be on within a year.
        node: [18, 20, 22, 24]
        os: [ubuntu-latest, macos-14, windows-latest]
        exclude:
          # Keep the matrix to a sane cost: full coverage on Linux, one non-Linux
          # confirmation per version rather than the full cross product.
          - { node: 18, os: macos-14 }
          - { node: 18, os: windows-latest }
          - { node: 24, os: macos-14 }
          - { node: 24, os: windows-latest }
          - { node: 20, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The custom-font checks need a font that is not the embedded one. A bare
      # runner has none, so they would silently skip -- install one so the
      # registry is genuinely exercised.
      #
      # Linux-only. This job now runs on macOS and Windows too, and `apt-get`
      # does not exist there: the failure reads `sudo: apt-get: command not
      # found`, which looks like a broken step rather than a wrong-platform step.
      - name: install a second font (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          ls /usr/share/fonts/truetype/liberation/LiberationSerif-Regular.ttf
      - name: build native binding
        # Cargo emits `.dll` on Windows and `.so` elsewhere, and the suffix is
        # what Node's `require` looks for. Hardcoding the `.so` made this job
        # Linux-only.
        shell: bash
        run: |
          cargo build --release -p hikari-rs-node
          for cand in target/release/libhikari_node.so \
                      target/release/libhikari_node.dylib \
                      target/release/hikari_node.dll \
                      target/release/hikari_node.lib; do
            [ -f "$cand" ] && cp "$cand" npm/hikari-node.node && break
          done
          test -f npm/hikari-node.node || { echo "no native binding produced"; ls target/release/ ; exit 1; }
      - name: test through a real node runtime
        run: node npm/test.mjs
      # Smoke-check the published package metadata: a missing `types` file or a
      # placeholder repository URL is invisible until someone installs it.
      - name: check package metadata
        shell: bash
        run: |
          cd npm
          npm pkg get name version types files repository > /dev/null
          test -f index.d.ts || { echo "index.d.ts declared in types but missing"; exit 1; }
          grep -q "github.com/theoxfaber/hikari" package.json || {
            echo "repository URL is not the real one"; exit 1; }

  font:
    name: embedded font shaping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # These tests are the only thing standing between us and a silently
      # broken embedded font: a subsetter that renumbers glyphs and drops
      # GSUB/GPOS still renders Latin, still passes a smoke test, and still
      # produces a valid PNG -- while losing Arabic joining, kerning and
      # ligatures. They are split into their own job so a font regression is
      # impossible to miss in the noise of a full workspace run.
      - run: cargo test -p hikari-rs-core font_subset -- --nocapture
      - run: cargo test -p hikari-rs-raster shaped_glyph_ids -- --nocapture

  font-chain:
    name: bundled font chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The chain splits a run by font coverage and shapes each segment with a
      # face that has the glyph. That is the only way fallback text can join,
      # because joining happens in the shaper and a character-keyed rasterizer
      # lookup bypasses it entirely. It gets its own job because the failure it
      # guards is silent: a broken chain still emits valid PNGs, just blank or
      # unshaped where a script should be.
      - name: fetch the OFL CJK face
        run: sh scripts/fetch-bundled-fonts.sh cjk
      - name: fallback routes to a real face
        run: cargo test -p hikari-rs-core --features bundled-cjk font_chain -- --nocapture
      - name: fallback reaches the rasterizer
        run: cargo test -p hikari-rs --features bundled-cjk --test font_fallback_chain -- --nocapture
      # The opt-in feature must not break the default build, so compile the
      # whole workspace with it on as well as off.
      - run: cargo clippy --workspace --all-targets --features hikari-rs/bundled-cjk -- -D warnings

  determinism:
    name: determinism (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Any matrix entry failing fails the job, and they are not allowed to
      # cancel each other: an earlier version of this workflow reported a
      # cancelled step as a failure often enough to be worth defending against.
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: arm64
            runner: macos-14
          - os: macos
            arch: x86_64
            runner: macos-15-intel
          - os: windows
            arch: x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same input must produce the same bytes on every platform, which is what
      # makes the output snapshot-testable at all. Expected digests live in
      # crates/hikari/tests/determinism.sha256; the example exits non-zero on a
      # mismatch and prints the re-bless command.
      #
      # This is the job that would have caught the CJK defect in v0.21.8, where
      # output depended on whether a host font was installed. It could not,
      # because it only ran on one runner with the font installed. Five targets
      # across three operating systems and two architectures is the minimum for
      # "everywhere" to mean anything.
      - run: cargo run --release -p hikari-rs --example determinism

  corpus:
    name: golden image corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One case per capability, so a visual regression names the feature that
      # moved instead of hiding in one opaque image. A mismatch prints the byte
      # delta, because "hash differs" does not tell a reviewer whether the
      # change was intended.
      - name: feature digests match
        run: cargo run --release -p hikari-rs --example corpus
      # A digest proves stability, not correctness: a blank render is just as
      # stable as a correct one and would be blessed happily. This asserts every
      # case actually has content, with measured floors. It is what caught the
      # radial gradient rendering as a flat fill.
      - name: every case draws something
        run: cargo run --release -p hikari-rs --example corpus_ink
      # The frozen CSS spec is committed, and a spec that drifts from the parser
      # is a contract being quietly broken. Regenerating and diffing catches both
      # directions: a property added without updating the spec, and a spec entry
      # for a property that no longer works.
      #
      # The `conformance` tests in hikari-core check the same thing from the Rust
      # side. Both are kept: they fail for different reasons, and the JSON is what
      # a downstream reader consumes.
      - name: the committed CSS spec matches the parser
        run: |
          cargo run --release -p hikari-rs --example css_spec
          git diff --exit-code -- docs/css-spec.json || {
            echo "::error::docs/css-spec.json is out of date; run \`cargo run -p hikari-rs --example css_spec\` and commit the result."
            exit 1
          }
      - name: the CSS conformance suite passes
        run: cargo test -p hikari-rs-core spec::conformance -- --nocapture

  benches:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A smoke run, not a gate: criterion on shared CI runners is far too noisy
      # to assert on a single measurement. This catches benches that stop
      # compiling or hang.
      #
      # It does one thing a bare smoke run did not: it prints criterion's change
      # column so a regression is visible in the log even though it is not
      # enforced. `--save-baseline` writes criterion's own state under `target`,
      # so a run in CI has nothing to compare against on its first execution --
      # but from the second onwards the log shows `change: +x.x%` per benchmark,
      # which turns "someone should look at this" into "someone did".
      - name: run render benchmarks
        run: |
          cargo bench -p hikari-rs --bench render -- \
            --warm-up-time 1 --measurement-time 2 --sample-size 10 --save-baseline ci
      - name: summarise
        run: |
          {
            echo "### render benchmark"
            echo ""
            echo 'Criterion reports a change against the previous run in the job log.'
            echo "Shared runners are noisy, so this is a signal, not a gate."
          } >> "$GITHUB_STEP_SUMMARY"

  bench-linux:
    name: benchmark (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Linux half of BENCHMARKS.md. Previously that row was recorded from
      # "the run that verified it" and never re-run, which is how a number ends
      # up in a document describing a version of the code from months ago.
      #
      # The gate here is deliberately weak: a GitHub runner is shared and
      # variable, so this asserts nothing about the timings. What it guarantees
      # is that a Linux measurement *exists* for the current commit and is
      # downloadable, so the document's Linux row is a measurement rather than a
      # memory. A real threshold belongs on a dedicated runner; see the note
      # where the regression gate used to be, further down this file.
      - run: cargo bench -p hikari-rs --bench render -- --warm-up-time 2 --measurement-time 5 --sample-size 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-linux
          path: target/criterion
      - name: record the headline numbers
        shell: bash
        run: |
          {
            echo "### render benchmark (linux x86_64, shared runner)"
            echo
            echo 'Timings from a shared runner are a signal, not a gate.'
            echo 'Full criterion output is in the criterion-linux artifact.'
            echo
            echo '| case | time |'
            echo '| --- | --- |'
            grep -rhoE '^(banner|text_card)_[0-9x]+/[a-z_]+ +time: +\[[^]]+\]' target/criterion 2>/dev/null               | sort -u || echo '| (see artifact) | |'
          } >> "$GITHUB_STEP_SUMMARY"

  wasm-size:
    name: wasm size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # A budget, not a smoke test. The WASM bundle grew 2.95 MB -> 3.51 MB over
      # three dependency migrations and nothing noticed, because "it compiles" is
      # not a statement about size. The README quotes a figure that had quietly
      # stopped being true.
      #
      # Unoptimised on purpose: this is the raw `cargo build --release` output,
      # which is what the README quotes and what a reviewer can reproduce without
      # installing wasm-opt. Adding wasm-opt would make the number better and
      # less checkable, and the budget is about catching *unplanned* growth.
      - name: build wasm
        run: cargo build --release -p hikari-rs-wasm --target wasm32-unknown-unknown
      - name: check against budget
        run: |
          set -euo pipefail
          WASM=$(find target/wasm32-unknown-unknown/release -maxdepth 1 -name '*.wasm' -print -quit)
          test -n "$WASM" || { echo "no wasm produced"; exit 1; }
          BYTES=$(wc -c < "$WASM" | tr -d ' ')
          # 3.75 MB, restored in v0.21.12 after having been raised to 3.88 MB
          # in v0.21.11. Both moves are recorded here.
          #
          # v0.21.11 raised it: the header-only image read cost +185,709 bytes,
          # which looked like an unavoidable price for the 300x layout win.
          #
          # v0.21.12 lowered it back: the 186 KB turned out to be duplication,
          # exactly as predicted. The raster backend decodes with
          # `load_from_memory`; the header path went through the generic
          # `ImageReader`, which monomorphised a second copy of every format
          # decoder. Replacing it with a hand-rolled header parse -- PNG IHDR,
          # JPEG SOFn segment scan, GIF logical screen descriptor, WebP
          # VP8/VP8L/VP8X -- recovered 185,355 bytes. The parse is pinned by
          # `crates/hikari-core/tests/dimensions_differential.rs`, which
          # asserts the same answer as `load_from_memory` for every supported
          # format, and totality for truncated and mutated input. That test
          # caught a real height/width swap in the JPEG scanner on its first
          # run.
          #
          # Measured 3,694,186 bytes against the restored 3,840,000 budget:
          # 145 KB of headroom. A budget that never moves catches nothing. One
          # that moves without a reason attached is how you end up at 8 MB
          # wondering why.
          BUDGET=$((3750 * 1024))
          MB=$(awk "BEGIN {printf \"%.2f\", $BYTES / 1048576}")
          echo "wasm: $MB ($BYTES bytes), budget 3.75 MB"
          if [ "$BYTES" -gt "$BUDGET" ]; then
            echo "::error::wasm grew to $MB, over the 3.75 MB budget."
            echo "If this was intended, raise the budget in .github/workflows/ci.yml"
            echo "and update the figure quoted in README.md."
            exit 1
          fi

  wasm-browser:
    name: wasm browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The playground bundle is gitignored and rebuilt here rather than
      # committed, which is what keeps it from drifting -- and a stale local
      # copy is exactly what this test caught during development: a twelve
      # release old bundle failed the `register_font` export check, which is
      # correct behaviour and the reason the check lists the expected names
      # instead of merely counting them.
      - name: build the bundle
        run: |
          cargo build --release -p hikari-rs-wasm --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n '2s/.*version = "\(.*\)"/\1/p')" --locked
          wasm-bindgen --target web --out-dir docs/playground/pkg \
            target/wasm32-unknown-unknown/release/hikari_wasm.wasm
      # Playwright is needed as an *importable module*, not just as a CLI: the
      # first version of this job ran `npx playwright@X install --with-deps
      # chromium`, which downloads the browsers and still leaves `import
      # { chromium } from "playwright"` failing with ERR_MODULE_NOT_FOUND.
      # Installing it as a real dependency is what makes the script resolve.
      - name: install playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.61.0
          npx playwright install --with-deps chromium
      # Serves the bundle over http and drives it in headless Chromium. The
      # `file://` protocol cannot load a `.wasm` sidecar, so a real origin is
      # part of what is under test.
      - run: node scripts/wasm-browser-test.mjs

  audit:
    # cargo-deny: advisories, licences, bans and sources. The `supply-chain`
    # job adds `cargo audit` and the SBOM; both read the RustSec database and
    # the overlap is deliberate -- cargo-deny is policy enforcement, cargo audit
    # has a faster database cadence, and a new advisory should fail one of them
    # even if the other has not been updated.
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  platform:
    name: test (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: macos, arch: arm64, runner: macos-14 }
          - { os: macos, arch: x86_64, runner: macos-15-intel }
          - { os: windows, arch: x86_64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The full test suite on every supported target. `check` covers Linux
      # x86_64 already; the rest exist because a rendering library has real
      # platform-dependent behaviour -- float rounding, `usize` width, byte
      # order in the PDF writer, path handling in the font fallback -- and none
      # of it is caught by a Linux-only run.
      #
      # Deliberately no system font is installed. The default fallback policy
      # must not read one, and a runner with fonts present is a runner that
      # cannot tell you if it does.
      # `hikari-rs-node` is excluded: its test binary links N-API symbols
      # (`napi_get_reference_value` and friends), which exist only inside a Node
      # process, so linking it on a bare runner fails with undefined symbols. The
      # `node` job builds it and runs its real test through an actual Node
      # runtime, which is a better check than "it compiles" anyway.
      #
      # Adding this step back to a Linux matrix entry is a mistake worth recording:
      # the failure is a link error that reads like a compiler problem.
      - name: tests
        run: cargo test --workspace --exclude hikari-rs-node

  verapdf:
    name: PDF/A conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the PDF/A fixture
        run: cargo run --release -p hikari-rs --example pdfa_fixture
      # veraPDF runs through `docker run` rather than a job-level `container:`.
      # A job container replaces the *entire* runner image, so there is no Rust
      # toolchain and no Node for the actions to run on -- the first version of
      # this job did that and died in setup-node before it ever reached veraPDF.
      # Pulling the same pinned image for one command gives veraPDF and the rest
      # of the toolchain in the same place.
      #
      # Pinned: a conformance checker that changes version between runs makes the
      # gate a moving target, and PDF/A-1b rule numbering has changed across
      # veraPDF releases.
      - name: validate against PDF/A-1b
        run: |
          set -uo pipefail
          docker pull verapdf/cli:v1.30.3
          # `2>&1` matters. veraPDF writes its report to stderr, so a plain
          # `| tee` captured nothing and the job reported "did not confirm
          # conformance" for a run that had produced no report at all. Those two
          # failures are different and conflating them sends whoever reads the log
          # looking for a conformance problem that is not there.
          # `JAVA_OPTS=-Xmx2g` is not a tuning knob, it is the difference
          # between a report and no report. The image ships with `JAVA_OPTS`
          # empty, and veraPDF loading a PDF/A-1 validation profile in a
          # default heap dies with "OutOfMemory caught when validating item"
          # *and still exits non-zero*. The first version of this job read
          # that as a conformance failure rather than as a crashed checker, and
          # the report it would have needed was never written.
          docker run --rm -e JAVA_OPTS="-Xmx2g" -v "$PWD:/work" verapdf/cli:v1.30.3 \
            --format text --flavour 1b /work/pdfa-fixture.pdf 2>&1 | tee verapdf-report.txt
          status=${PIPESTATUS[0]}
          echo "veraPDF exit status: $status"
          if [ ! -s verapdf-report.txt ]; then
            echo "::error::veraPDF produced no report at all (exit $status)."
            echo "That is a broken invocation, not a conformance verdict."
            docker run --rm verapdf/cli:v1.30.3 --version || true
            exit 1
          fi
          # The exit code alone is not enough to gate on: veraPDF exits non-zero
          # for a failed validation and also when it cannot decide, and those two
          # must not look the same. The verdict text is checked as well.
          # The verdict line is `PASS <file> 1b`. It is NOT the phrase "is in
          # accordance with PDF/A-1" that an older version of this job grepped
          # for: verified against veraPDF 1.30.3, that phrase appears zero times
          # even when the file passes. So the gate could never have gone green,
          # and its failure mode was indistinguishable from real
          # non-conformance. Both spellings are accepted so the check survives a
          # future change in the CLI's wording.
          if grep -qE '^PASS[[:space:]]' verapdf-report.txt \
             || grep -qi "is in accordance with PDF/A-1" verapdf-report.txt; then
            echo "veraPDF: conforms to PDF/A-1b"
          else
            # An XML report alongside the text one: the text report says only
            # FAIL, which is not actionable. The failing clause numbers are the
            # whole point of running the checker.
            docker run --rm -e JAVA_OPTS="-Xmx2g" -v "$PWD:/work" verapdf/cli:v1.30.3 \
              --format xml --flavour 1b /work/pdfa-fixture.pdf > verapdf-report.xml 2>/dev/null || true
            # Report which clauses failed, not just "did not confirm". The text
            # report says only FAIL; the XML carries the clause numbers, and
            # those are the actionable part.
            echo "::group::failing PDF/A-1b clauses"
            tr '<' '\n' < verapdf-report.xml \
              | grep -A3 'rule specification=' \
              | grep -E 'clause="[0-9]' \
              | sed -E 's/.*clause="([^"]*)" testNumber="([0-9]+)".*/- clause \1\/\2/' \
              || echo "  (none parsed)"
            echo "::endgroup::"
            echo "::error::veraPDF did not confirm PDF/A-1b conformance. Clauses above."
            exit 1
          fi

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every parser that takes untrusted bytes. `css` reaches the HTML and
        # CSS scanner, `pdf` the PDF writer and font subsetter, `tree_json`
        # the serde tree that the WASM and Node bindings parse from JSON,
        # `fonts` the font faces the WASM/Node `register_font` entry point
        # accepts from a caller.
        target: [css, pdf, tree_json, fonts]
        # libFuzzer flags LeakSanitizer reports at exit. `fonts` trips it by
        # construction: `register_font` interns the caller's bytes, entry and
        # parsed face for the life of the process *by documented contract* (a
        # wasm page registers its fonts once and reuses the ids), so every
        # parsed input leaves a process-lifetime allocation LeakSanitizer
        # counts. Leak detection stays on for the other three targets, where a
        # report would be a real per-call leak; this one is guarded by the
        # 1 MB input cap and the bounded CI budget instead.
        lsan:
          [true, true, true, false]
    steps:
      - uses: actions/checkout@v4
      # Nightly plus cargo-fuzz. `cargo fuzz` is a separate cargo subcommand and
      # is not present on a stock runner: the first run of this job failed with
      # "no such command: `fuzz`". Installing it from the same pinned toolchain
      # rather than from a random release keeps the two in step.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      # Installed and then *verified*. `taiki-e/install-action@cargo-fuzz` was in
      # the previous revision and the job still died with "no such command:
      # `fuzz`", so the version is now asserted before the run rather than
      # assumed to have landed.
      - name: install cargo-fuzz
        run: |
          cargo +nightly install cargo-fuzz --locked
          cargo +nightly fuzz --version
      # No `apt-get` action here. Two spellings of the popular one were tried --
      # `Apodinially/apt-get` (the maintainer's actual handle is a different
      # repository) and `apodrinaly/apt-get`, which is 404 -- and depending on a
      # third-party action to install one package is not worth the failure mode.
      # GitHub's Ubuntu images ship clang, which is all cargo-fuzz needs.
      - name: confirm the sanitizer runtime is present
        shell: bash
        run: clang --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # A bounded run, not a real fuzzing campaign. The point is that the
      # harnesses compile, the seeds are exercised, and a crash is caught within
      # CI's time budget. A long campaign belongs on a dedicated runner, the same
      # way the benchmark gate does.
      - run: |
          ARGS=(-max_total_time=90)
          [ "${{ matrix.lsan }}" = true ] || ARGS+=(-detect_leaks=0)
          cargo +nightly fuzz run ${{ matrix.target }} -- "${ARGS[@]}"
      # Any crash leaves an artifact; failing the build on one is the entire
      # value of the job.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/

  # The criterion regression gate is NOT here, deliberately.
  #
  # It measured against a committed baseline and was worth having, but it needs
  # a runner labelled `[self-hosted, linux, x64, bench]` and criterion on a
  # shared GitHub-hosted runner produces numbers too noisy to gate on -- a gate
  # that is too tight gets disabled, which is worse than no gate.
  #
  # It sat in this workflow with `if: github.repository == ...` on the job,
  # which only covers forks. On the real repository with no such runner the job
  # queued forever, and a run with a permanently-queued job never reaches a
  # conclusion -- so *every* run read as inconclusive, not just this job. Two
  # macOS entries had the same problem from the other direction: they named
  # `macos-13`, which GitHub has retired.
  #
  # `benchmark smoke` below runs everywhere and keeps the benches compiling and
  # finishing. To run the real gate, on a machine with stable, quiet hardware:
  #
  #   cargo bench -p hikari-rs --bench render -- \
  #     --warm-up-time 3 --measurement-time 10 --sample-size 50 \
  #     --save-baseline main --baseline main --failure-threshold 15
  #
  # The first run has nothing to compare and criterion reports "change: n/a"
  # rather than a fabricated number.

  supply-chain:
    name: audit + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo audit` covers the RustSec advisory database, which `cargo deny`
      # also reads. Both run deliberately: `deny` enforces policy and covers
      # licences and sources, `audit` has the faster database update cadence and
      # catches an advisory in the window between two releases of cargo-deny.
      - name: RustSec advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # A real CycloneDX SBOM. Not `audit-check`'s SARIF: that file is a list of
      # *known vulnerabilities*, which is what the step above consumes. An SBOM
      # is an inventory of what is actually in the build, and conflating the two
      # produces a file that looks like an SBOM and is not one.
      #
      # An SBOM nobody consumes is a report nobody reads, so it is uploaded as a
      # build artifact rather than written into a log and lost.
      - name: generate SBOM
        run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --all-features --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/*.cdx.json
