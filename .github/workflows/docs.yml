name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes docs/ to GitHub Pages. The playground WASM is built here rather
# than committed: it is a ~2.7 MB artifact that would churn on every release and
# can silently drift from the font subset baked into the library.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-bindgen-cli
        # Must match the wasm-bindgen version in Cargo.lock exactly; a mismatch
        # produces glue that fails at runtime with no build-time error.
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: build wasm
        run: |
          cargo build --release -p hikari-rs-wasm --target wasm32-unknown-unknown
          wasm-bindgen target/wasm32-unknown-unknown/release/hikari_wasm.wasm \
            --out-dir docs/playground/pkg --target web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
