[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# `ttf-parser` is declared unmaintained by its author (RUSTSEC-2026-0192).
#
# Exactly one crate still depends on it directly: hikari-pdf, which embeds font
# subsets and reads glyph metrics to build PDF font objects.
#
# Everything else has moved. The shaper uses `harfrust` and the rasterizer uses
# `skrifa`; both read through `read-fonts`, so there is now one font parser in the
# tree instead of two, and `fontdue` is gone entirely. That matters beyond the
# advisory: it removed a duplicate parser from the WebAssembly build.
#
# What remains is PDF font embedding, which is the last holdout and a genuinely
# separate piece of work from rendering. RustSec's own recommendation for this
# crate is `skrifa`.
unmaintained = "all"

# Ignored explicitly, with a reason, rather than by lowering a severity knob.
# This keeps the exception visible in the config and in every `cargo deny`
# report instead of quietly weakening the gate for everything else.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is declared unmaintained. One direct user left: hikari-pdf, for font embedding and metrics. The shaper (harfrust) and the rasterizer (skrifa) both moved to read-fonts, so the rasterizer no longer pulls it in and fontdue is gone from the tree. Remaining work is PDF font embedding. RustSec's own recommendation for this crate is skrifa." },
]

[licenses]
# Everything here is permissive and compatible with this project's
# MIT OR Apache-2.0. The list is the union of what the current tree needs --
# cargo-deny fails the build on anything not named, which is the point, so add
# deliberately rather than switching to a blanket allow.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
