[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# `ttf-parser` is declared unmaintained by its author (RUSTSEC-2026-0192).
#
# We depend on it directly in hikari-pdf, which embeds font subsets and reads
# glyph metrics. The shaper no longer contributes: `rustybuzz` was replaced with
# `harfrust`, which reads through `read-fonts`, so that path is off ttf-parser.
# What remains is `fontdue`, the rasterizer, which still depends on ttf-parser
# itself -- so the advisory cannot be cleared until the rasterizer is replaced
# too, no matter what our own call sites do. Warning rather than failing keeps
# the signal visible without pretending a partial swap fixes something it cannot.
#
# The RustSec advisory's own recommendation for this crate is `skrifa`.
unmaintained = "all"

# Ignored explicitly, with a reason, rather than by lowering a severity knob.
# This keeps the exception visible in the config and in every `cargo deny`
# report instead of quietly weakening the gate for everything else.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is declared unmaintained. Our shaper no longer reaches it -- harfrust reads via read-fonts -- but hikari-pdf uses it directly and fontdue (the rasterizer) depends on it, so it stays in the tree until the rasterizer is replaced. RustSec's own recommendation for this crate is skrifa." },
]

[licenses]
# Everything here is permissive and compatible with this project's
# MIT OR Apache-2.0. The list is the union of what the current tree needs --
# cargo-deny fails the build on anything not named, which is the point, so add
# deliberately rather than switching to a blanket allow.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
