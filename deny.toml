[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# No advisories are ignored, and there is nothing to ignore.
#
# This file used to carry two. Both are gone, and how they went is the point:
#
#   * RUSTSEC-2026-0206 (`rustybuzz`, unmaintained) -- the shaper moved to
#     `harfrust`, the HarfBuzz project's own maintained fork, which began as a
#     fork of `rustybuzz` and swapped `ttf-parser` for `read-fonts`. It shapes
#     identically; every corpus digest was unchanged by the move.
#
#   * RUSTSEC-2026-0192 (`ttf-parser`, unmaintained) -- which could not be
#     cleared by any partial swap, because `rustybuzz` and `fontdue` each pulled
#     it in transitively. It took all three replacements: `harfrust` for shaping,
#     `skrifa` for glyph rasterization, and `skrifa` again for PDF font embedding
#     and metrics.
#
# The side effect is worth more than the advisory. The tree now has exactly one
# font parser, `read-fonts`, instead of `ttf-parser` alongside `read-fonts`, and
# `fontdue` is gone entirely.
#
# `unmaintained = "all"` is kept as a gate rather than an exception: any crate
# that declares itself unmaintained from here on fails the build instead of
# needing a written justification.
unmaintained = "all"

[licenses]
# Everything here is permissive and compatible with this project's
# MIT OR Apache-2.0. The list is the union of what the current tree needs --
# cargo-deny fails the build on anything not named, which is the point, so add
# deliberately rather than switching to a blanket allow.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
